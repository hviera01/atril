<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#15110e">
<title>Atril remoto</title>
<style>
:root{--tinta:#15110e;--tinta2:#1a1511;--panel:#1f1914;--panel2:#291f17;--linea:#352c22;--linea2:#4a3d2e;--papel:#f1e8d8;--papel2:#cdbfa8;--apagado:#9a8d78;--brasa:#e8572a;--oro:#d8a24a;--serif:Georgia,'Times New Roman',serif;--sans:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--tinta);color:var(--papel);font:15px/1.4 var(--sans);overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
svg{display:block;flex:none}
header{display:flex;align-items:center;gap:11px;padding:10px 14px 10px 12px;border-bottom:1px solid var(--linea);position:relative;padding-top:max(10px,env(safe-area-inset-top))}
header::after{content:'';position:absolute;left:0;bottom:-1px;width:96px;height:2px;background:linear-gradient(90deg,var(--brasa),var(--oro))}
header img{width:38px;height:38px}
.marca{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.marca b{font:600 15.5px var(--serif);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.marca small{font:700 9.5px var(--sans);letter-spacing:.16em;color:var(--oro);margin-top:3px}
.estado{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font:700 10px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--apagado);white-space:nowrap}
.estado i{width:8px;height:8px;border-radius:50%;background:#5e5240}
.estado.vivo{color:var(--brasa)}
.estado.vivo i{background:var(--brasa);animation:pulso 1.6s ease-in-out infinite}
.estado.off{color:#d4503f}
.estado.off i{background:#d4503f}
@keyframes pulso{50%{opacity:.35}}

.vivo-card{margin:10px 12px 0;background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--linea2);border-radius:3px}
.vivo-card.on{border-left-color:var(--brasa)}
.vivo-cab{display:flex;align-items:center;gap:8px;padding:9px 6px 0 14px}
.vivo-ref{flex:1;min-width:0;font:700 11px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--oro);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vivo-texto{margin:3px 14px 12px;font:17px/1.35 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.vivo-texto.vacio{color:var(--apagado);font-style:italic}
.pantalla{display:flex;gap:2px}
.pantalla button{width:38px;height:36px;display:grid;place-items:center;border-radius:3px;color:var(--papel2)}
.pantalla button.on{background:var(--oro);color:#1c1408}

main{flex:1;min-height:0;overflow-y:auto;padding:12px 12px 18px;-webkit-overflow-scrolling:touch}
.tit{margin:0 0 10px;font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--oro)}
.buscador{display:flex;align-items:center;gap:10px;height:46px;padding:0 6px 0 13px;background:var(--panel);border:1px solid var(--linea2);border-radius:3px;color:var(--apagado)}
.buscador:focus-within{border-color:var(--oro);color:var(--oro)}
.buscador input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--papel);font:16px var(--sans)}
.buscador input::placeholder{color:#7a6f5d}
.buscador button{width:36px;height:36px;display:grid;place-items:center;color:var(--papel2)}
.filtro{margin-bottom:12px}

.pista{margin:14px 0 4px;color:var(--apagado);font-size:13px;line-height:1.5}
.cap-cab{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:16px 0 6px}
.cap-cab small{font:700 10px var(--sans);letter-spacing:.15em;text-transform:uppercase;color:var(--oro)}
.cap-cab h2{margin:2px 0 0;font:500 28px/1.1 var(--serif)}
.cap-nav{display:flex;gap:6px}
.cap-nav button,.icon-borde{width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--linea2);border-radius:3px;color:var(--papel2)}
.cap-nav button:active,.icon-borde:active{background:var(--panel2)}
.cap-ayuda{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 8px;font-size:12.5px;color:var(--apagado)}
.mini{padding:6px 11px;border:1px solid var(--linea2);border-radius:3px;font-weight:600;font-size:12.5px;color:var(--papel);white-space:nowrap}
.v{display:flex;align-items:stretch;border-bottom:1px solid #261f18}
.chk{width:44px;display:grid;place-items:center;flex:none}
.caja{width:22px;height:22px;display:grid;place-items:center;border:2px solid var(--linea2);border-radius:4px;color:#1c1408}
.caja.on{background:var(--oro);border-color:var(--oro)}
.vt{flex:1;min-width:0;display:flex;gap:11px;align-items:flex-start;text-align:left;padding:12px 6px 12px 0}
.vt b{flex:none;min-width:22px;text-align:right;font:600 15px var(--serif);color:var(--oro);padding-top:2px}
.vt span{font:17px/1.45 var(--serif)}
.v.marcado{background:rgba(216,162,74,.12)}
.v.tocado{background:rgba(232,87,42,.16)}
.v.tocado .vt b{color:var(--brasa)}
.pedido{background:rgba(216,162,74,.08)}
.barra-sel{position:sticky;bottom:-18px;margin:14px -12px -18px;padding:10px 12px calc(10px + 18px);display:flex;align-items:center;gap:8px;background:var(--tinta2);border-top:2px solid var(--oro);box-shadow:0 -12px 24px rgba(0,0,0,.5)}
.barra-sel .txt{flex:1;min-width:0;font-size:13px;color:var(--papel2);line-height:1.25}
.barra-sel .txt b{color:var(--oro);font-size:15px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 15px;border:1px solid var(--linea2);border-radius:3px;font-weight:600;font-size:14px;background:none}
.btn.lleno{background:var(--brasa);border-color:var(--brasa);color:#fff7ee}
.btn:active{filter:brightness(1.2)}

.lista{display:flex;flex-direction:column;gap:6px}
.fila{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);border:1px solid var(--linea);border-left:3px solid transparent;border-radius:3px;padding:12px;min-height:50px}
.fila:active{background:var(--panel2)}
.fila.activa{border-left-color:var(--brasa);background:#2b1c16}
.fila .ic{color:var(--oro)}
.fila .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.fila .tx b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .tx small{color:var(--apagado);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fila .en{font:700 9.5px var(--sans);letter-spacing:.13em;text-transform:uppercase;color:var(--brasa)}
.seccion{display:flex;align-items:center;gap:10px;margin:16px 2px 6px;font:600 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--oro)}
.seccion::after{content:'';flex:1;height:1px;background:var(--linea2)}
.res-pal{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--linea);border-radius:3px;padding:11px 12px;margin-bottom:6px}
.res-pal:active{background:var(--panel2)}
.res-pal .r{display:flex;align-items:center;justify-content:space-between;font:700 11px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--oro);margin-bottom:3px}
.res-pal .r em{font-style:normal;font-weight:600;color:var(--apagado);text-transform:none;letter-spacing:0;padding:3px 8px;border:1px solid var(--linea2);border-radius:3px}
.res-pal .t{font:16px/1.4 var(--serif)}
.libro{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px 12px;text-align:left;border-bottom:1px solid #261f18;font-weight:500}
.libro:active{background:var(--panel)}
.libro small{color:var(--apagado)}
.grupo{margin:14px 0 2px;font:600 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--apagado)}
.caps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:6px}
.caps button{height:46px;background:var(--panel);border:1px solid var(--linea2);border-radius:3px;font-weight:600;font-size:16px}
.caps button:active{background:var(--oro);color:#1c1408;border-color:var(--oro)}
.atras{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;color:var(--oro);font-weight:600;font-size:14px;padding:6px 4px}
.libro-tit{margin:4px 0 8px;font:500 28px/1.1 var(--serif)}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px 14px;background:var(--panel);border:1px solid var(--linea);border-radius:3px;text-align:left;min-height:104px}
.tile:active{background:var(--panel2);border-color:var(--oro)}
.tile svg{color:var(--oro)}
.tile b{font-weight:600;font-size:15px;line-height:1.2}
.tile small{color:var(--apagado);font-size:12px;margin-top:-6px}

.dock{border-top:1px solid var(--linea);background:var(--tinta2);padding:10px 12px 0}
.pasos{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.paso{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border:1px solid var(--linea2);border-radius:3px;background:var(--panel2);font:600 17px var(--sans)}
.paso.grande{background:var(--brasa);border-color:var(--brasa);color:#fff7ee;font-size:19px}
.paso:active{transform:scale(.98);filter:brightness(1.12)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:6px -12px 0;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;color:var(--apagado);font-weight:600;font-size:11.5px;border-top:3px solid transparent}
.tabs button.on{color:var(--papel);border-top-color:var(--oro)}
.tabs button.on svg{color:var(--oro)}
.vacio{color:var(--apagado);text-align:center;padding:34px 10px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <img id="logo" alt="">
  <div class="marca"><b>Iglesia Lirio de los Valles</b><small>AD · CONTROL REMOTO</small></div>
  <span class="estado" id="estado"><i></i><span id="estadoTxt">conectando</span></span>
</header>

<section class="vivo-card" id="vivoCard">
  <div class="vivo-cab">
    <span class="vivo-ref" id="vref">En pantalla</span>
    <div class="pantalla">
      <button id="negro" title="Pantalla en negro" aria-label="Pantalla en negro"></button>
      <button id="logoBtn" title="Logo" aria-label="Logo"></button>
      <button id="limpiar" title="Limpiar" aria-label="Limpiar"></button>
    </div>
  </div>
  <p class="vivo-texto vacio" id="vtexto">Nada proyectado</p>
</section>

<main id="vista"></main>

<footer class="dock">
  <div class="pasos">
    <button class="paso" id="ant"></button>
    <button class="paso grande" id="sig"></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</footer>

<script>
const k = new URLSearchParams(location.search).get('k');
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const vibrar = () => { try { navigator.vibrate && navigator.vibrate(8); } catch (e) {} };

const P = {
  busqueda: '<circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/>',
  cerrar: '<path d="M6 6l12 12M18 6L6 18"/>',
  anterior: '<path d="M15 5l-7 7 7 7"/>',
  siguiente: '<path d="M9 5l7 7-7 7"/>',
  arriba: '<path d="M12 19V5M6 11l6-6 6 6"/>',
  abajo: '<path d="M12 5v14M6 13l6 6 6-6"/>',
  elemAnt: '<path d="M6 5v14M19 6l-9 6 9 6z"/>',
  elemSig: '<path d="M18 5v14M5 6l9 6-9 6z"/>',
  negro: '<rect x="3" y="5" width="18" height="12" rx="2" fill="currentColor" fill-opacity=".35"/><path d="M8 20h8"/>',
  logo: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.2" fill="currentColor" stroke="none"/>',
  limpiar: '<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M9 10l6 4M15 10l-6 4"/>',
  biblia: '<path d="M12 6c-2-1.5-5-2-8-1.6V18c3-.4 6 .1 8 1.6 2-1.5 5-2 8-1.6V4.4C17 4 14 4.5 12 6zM12 6v13.6"/>',
  culto: '<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
  controles: '<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>',
  check: '<path d="M5 12.5l5 5 9-10"/>',
  cancion: '<path d="M9 18V6l10-2v12"/><circle cx="7" cy="18" r="2.5"/><circle cx="17" cy="16" r="2.5"/>',
  imagen: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="M4 18l5-5 4 4 3-3 4 4"/>',
  texto: '<path d="M5 6h14M12 6v13M9 19h6"/>',
  reloj: '<circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l3 2M9.5 3h5"/>',
  play: '<path d="M8 5l11 7-11 7z" fill="currentColor" stroke="none"/>',
};
const ico = (n, t = 22) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n]}</svg>`;
const ICONO_TIPO = { biblia: 'biblia', cancion: 'cancion', imagen: 'imagen', video: 'imagen', texto: 'texto', temporizador: 'reloj' };

const enviar = (o) => { vibrar(); return fetch('/cmd?k=' + k, { method: 'POST', body: JSON.stringify(o) }); };
const pedir = async (ruta) => (await fetch(ruta + (ruta.includes('?') ? '&' : '?') + 'k=' + k)).json();

$('logo').src = '/logo.png?k=' + k;
$('negro').innerHTML = ico('negro', 20);
$('logoBtn').innerHTML = ico('logo', 20);
$('limpiar').innerHTML = ico('limpiar', 20);
$('ant').innerHTML = ico('anterior', 22) + '<span>Anterior</span>';
$('sig').innerHTML = '<span>Siguiente</span>' + ico('siguiente', 22);
$('negro').onclick = () => enviar({ tipo: 'negro' });
$('logoBtn').onclick = () => enviar({ tipo: 'logo' });
$('limpiar').onclick = () => enviar({ tipo: 'limpiar' });
$('ant').onclick = () => enviar({ tipo: 'anterior' });
$('sig').onclick = () => enviar({ tipo: 'siguiente' });

const TABS = [['buscar', 'Buscar', 'busqueda'], ['biblia', 'Biblia', 'biblia'], ['culto', 'Culto', 'culto'], ['controles', 'Controles', 'controles']];
let tab = 'buscar';
let libros = [];
let estado = { servicio: '', elementos: [], vivo: null, modo: 'contenido' };

$('tabs').innerHTML = TABS.map(([id, t, i]) => `<button data-t="${id}">${ico(i, 22)}<span>${t}</span></button>`).join('');
document.querySelectorAll('#tabs button').forEach((b) => b.onclick = () => irTab(b.dataset.t));

const vistas = { buscar: document.createElement('div'), biblia: document.createElement('div'), culto: document.createElement('div'), controles: document.createElement('div') };
function irTab(t) {
  tab = t;
  document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
  const main = $('vista');
  main.replaceChildren(vistas[t]);
  if (t === 'culto') pintarCulto();
}

function pintarEstado(e) {
  estado = e;
  const st = $('estado');
  const txt = e.modo === 'negro' ? 'En negro' : e.modo === 'logo' ? 'Logo' : e.vivo ? 'En vivo' : 'Sin proyectar';
  $('estadoTxt').textContent = txt;
  st.className = 'estado' + (e.modo === 'contenido' && e.vivo ? ' vivo' : '');
  $('negro').classList.toggle('on', e.modo === 'negro');
  $('logoBtn').classList.toggle('on', e.modo === 'logo');
  $('vivoCard').classList.toggle('on', e.modo === 'contenido' && !!e.vivo);
  $('vref').textContent = e.vivo ? (e.vivo.ref || e.vivo.titulo || 'En pantalla') : 'En pantalla';
  $('vtexto').textContent = e.vivo ? e.vivo.texto : 'Nada proyectado';
  $('vtexto').classList.toggle('vacio', !e.vivo);
  if (tab === 'culto') pintarCulto();
}

function pintarCulto() {
  const v = vistas.culto;
  const els = estado.elementos || [];
  let h = `<h3 class="tit">${esc(estado.servicio || 'Sin culto abierto')}</h3>`;
  if (!estado.servicio) h += '<div class="vacio">No hay un culto abierto en la computadora.<br>Ábrelo allá, o proyecta desde Buscar y Biblia.</div>';
  else if (!els.length) h += '<div class="vacio">El culto está vacío.</div>';
  else {
    h += '<div class="lista">' + els.map((x) => x.tipo === 'seccion'
      ? `</div><div class="seccion">${esc(x.titulo)}</div><div class="lista">`
      : `<button class="fila${estado.vivo && estado.vivo.elementoId === x.id ? ' activa' : ''}" data-id="${esc(x.id)}"><span class="ic">${ico(ICONO_TIPO[x.tipo] || 'texto', 20)}</span><span class="tx"><b>${esc(x.titulo)}</b><small>${esc(x.sub || '')}</small></span>${estado.vivo && estado.vivo.elementoId === x.id ? '<span class="en">en vivo</span>' : ''}</button>`).join('') + '</div>';
  }
  v.innerHTML = h;
  v.querySelectorAll('.fila').forEach((b) => b.onclick = () => enviar({ tipo: 'elemento', id: b.dataset.id }));
}

function montarControles() {
  const v = vistas.controles;
  const t = [
    ['versoAnt', 'arriba', 'Versículo anterior', 'Aunque no esté en el culto'],
    ['versoSig', 'abajo', 'Versículo siguiente', 'Aunque no esté en el culto'],
    ['elementoAnt', 'elemAnt', 'Elemento anterior', 'Del culto'],
    ['elementoSig', 'elemSig', 'Elemento siguiente', 'Del culto'],
  ];
  v.innerHTML = '<h3 class="tit">Navegar</h3><div class="tiles">' + t.map(([c, i, a, b]) => `<button class="tile" data-c="${c}">${ico(i, 26)}<b>${a}</b><small>${b}</small></button>`).join('') + '</div><p class="pista">El negro, el logo y limpiar están arriba, junto a lo que se está proyectando.</p>';
  v.querySelectorAll('.tile').forEach((b) => b.onclick = () => enviar({ tipo: b.dataset.c }));
}

function nombreRango(nums) {
  const o = [...nums].sort((a, b) => a - b);
  const r = [];
  for (const n of o) { const u = r[r.length - 1]; if (u && n === u[1] + 1) u[1] = n; else r.push([n, n]); }
  return r.map(([a, b]) => (a === b ? a : a + '-' + b)).join(', ');
}

async function montarCapitulo(cont, libro, cap, destacar, alVolver) {
  cont.innerHTML = '<div class="vacio">Cargando…</div>';
  const versos = await pedir(`/capitulo?libro=${libro}&cap=${cap}`);
  const l = libros[libro - 1];
  const marcados = new Set();
  let ancla = null;
  const cabecera = `${alVolver ? `<button class="atras" id="atras">${ico('anterior', 18)} ${esc(alVolver.texto)}</button>` : ''}
    <div class="cap-cab"><div><small>Reina-Valera 1960</small><h2>${esc(l.nombre)} ${cap}</h2></div>
    <div class="cap-nav"><button id="capAnt" aria-label="Capítulo anterior">${ico('anterior', 20)}</button><button id="capSig" aria-label="Capítulo siguiente">${ico('siguiente', 20)}</button></div></div>
    <div class="cap-ayuda"><span>Toca el texto para proyectar. Marca varios con las casillas.</span><button class="mini" id="todos">Todos</button></div>`;
  cont.innerHTML = cabecera + '<div id="vs"></div><div class="barra-sel" id="barra" hidden></div>';
  const vs = cont.querySelector('#vs');
  vs.innerHTML = versos.map((x) => {
    const ped = destacar && x.v >= destacar[0] && x.v <= destacar[1];
    return `<div class="v${ped ? ' pedido' : ''}" data-v="${x.v}" id="cv-${x.v}"><button class="chk" aria-label="Marcar versículo ${x.v}"><span class="caja"></span></button><button class="vt"><b>${x.v}</b><span>${esc(x.t)}</span></button></div>`;
  }).join('');
  const barra = cont.querySelector('#barra');
  const refrescar = () => {
    vs.querySelectorAll('.v').forEach((f) => {
      const on = marcados.has(Number(f.dataset.v));
      f.classList.toggle('marcado', on);
      const c = f.querySelector('.caja');
      c.classList.toggle('on', on);
      c.innerHTML = on ? ico('check', 15) : '';
    });
    barra.hidden = marcados.size === 0;
    if (marcados.size) {
      barra.innerHTML = `<span class="txt"><b>${marcados.size}</b> ${marcados.size === 1 ? 'versículo' : 'versículos'}<br>${esc(l.nombre)} ${cap}:${nombreRango(marcados)}</span><button class="btn" id="quitar">Quitar</button><button class="btn lleno" id="proy">${ico('play', 15)} Proyectar</button>`;
      barra.querySelector('#quitar').onclick = () => { marcados.clear(); ancla = null; refrescar(); };
      barra.querySelector('#proy').onclick = () => enviar({ tipo: 'versiculos', libro, capitulo: cap, lista: [...marcados].sort((a, b) => a - b) });
    }
  };
  vs.querySelectorAll('.v').forEach((f) => {
    const n = Number(f.dataset.v);
    f.querySelector('.vt').onclick = () => {
      enviar({ tipo: 'versiculo', libro, capitulo: cap, versiculo: n });
      vs.querySelectorAll('.tocado').forEach((x) => x.classList.remove('tocado'));
      f.classList.add('tocado');
    };
    f.querySelector('.chk').onclick = () => {
      vibrar();
      if (marcados.has(n)) marcados.delete(n); else marcados.add(n);
      ancla = n;
      refrescar();
    };
  });
  cont.querySelector('#todos').onclick = () => { versos.forEach((x) => marcados.add(x.v)); refrescar(); };
  const ir = (lb, c) => {
    if (c < 1) { if (lb === 1) return; lb -= 1; c = libros[lb - 1].capitulos; }
    if (c > libros[lb - 1].capitulos) { if (lb === 66) return; lb += 1; c = 1; }
    montarCapitulo(cont, lb, c, null, alVolver);
    $('vista').scrollTop = 0;
  };
  cont.querySelector('#capAnt').onclick = () => ir(libro, cap - 1);
  cont.querySelector('#capSig').onclick = () => ir(libro, cap + 1);
  if (alVolver) cont.querySelector('#atras').onclick = alVolver.fn;
  if (destacar) { const el = cont.querySelector('#cv-' + destacar[0]); if (el) el.scrollIntoView({ block: 'center' }); }
}

function montarCapitulos(cont, libro, alVolver, alElegir) {
  const l = libros[libro - 1];
  cont.innerHTML = `${alVolver ? `<button class="atras" id="atras">${ico('anterior', 18)} ${esc(alVolver.texto)}</button>` : ''}<h2 class="libro-tit">${esc(l.nombre)}</h2><p class="tit">${l.capitulos} ${l.capitulos === 1 ? 'capítulo' : 'capítulos'}</p><div class="caps">${Array.from({ length: l.capitulos }, (_, i) => `<button data-c="${i + 1}">${i + 1}</button>`).join('')}</div>`;
  cont.querySelectorAll('.caps button').forEach((b) => b.onclick = () => alElegir(Number(b.dataset.c)));
  if (alVolver) cont.querySelector('#atras').onclick = alVolver.fn;
}

const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

function montarBiblia() {
  const v = vistas.biblia;
  const estadoB = { libro: null };
  const verLibros = () => {
    estadoB.libro = null;
    v.innerHTML = `<div class="buscador filtro"><span>${ico('busqueda', 19)}</span><input id="fl" placeholder="Filtrar libros" autocomplete="off" autocapitalize="off"></div><div id="ll"></div>`;
    const pintar = () => {
      const f = norm(v.querySelector('#fl').value.trim());
      const vis = libros.filter((l) => !f || norm(l.nombre).includes(f));
      const grupo = (t, lista) => lista.length ? `<div class="grupo">${t}</div>` + lista.map((l) => `<button class="libro" data-id="${l.id}"><span>${esc(l.nombre)}</span><small>${l.capitulos}</small></button>`).join('') : '';
      v.querySelector('#ll').innerHTML = grupo('Antiguo Testamento', vis.filter((l) => l.testamento === 'AT')) + grupo('Nuevo Testamento', vis.filter((l) => l.testamento === 'NT'));
      v.querySelectorAll('.libro').forEach((b) => b.onclick = () => verCapitulos(Number(b.dataset.id)));
    };
    v.querySelector('#fl').oninput = pintar;
    pintar();
  };
  const verCapitulos = (libro) => {
    estadoB.libro = libro;
    montarCapitulos(v, libro, { texto: 'Libros', fn: verLibros }, (c) => {
      montarCapitulo(v, libro, c, null, { texto: libros[libro - 1].nombre, fn: () => verCapitulos(libro) });
      $('vista').scrollTop = 0;
    });
    $('vista').scrollTop = 0;
  };
  verLibros();
}

function montarBuscar() {
  const v = vistas.buscar;
  v.innerHTML = `<div class="buscador"><span>${ico('busqueda', 19)}</span><input id="q" placeholder="jn 3 16 · salmo 23 · amor de Dios" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="search"><button id="x" hidden aria-label="Borrar">${ico('cerrar', 18)}</button></div><div id="res"></div>`;
  const q = v.querySelector('#q');
  const x = v.querySelector('#x');
  const res = v.querySelector('#res');
  let tiempo = 0;
  let ticket = 0;
  const buscar = async () => {
    const texto = q.value.trim();
    x.hidden = !q.value;
    if (!texto) { res.innerHTML = '<p class="pista">Escribe un pasaje (<b>jn 3 16</b>, <b>salmo 23</b>, <b>1 co 13:4-7</b>), una palabra del versículo o el nombre de una canción. O usa la pestaña Biblia para elegir libro, capítulo y versículos.</p>'; return; }
    const mio = ++ticket;
    const r = await pedir('/buscar?q=' + encodeURIComponent(texto));
    if (mio !== ticket) return;
    res.innerHTML = '';
    if (r.referencia) {
      const caja = document.createElement('div');
      res.appendChild(caja);
      const rf = r.referencia;
      montarCapitulo(caja, rf.libro, rf.capitulo, rf.desde ? [rf.desde, rf.hasta || rf.desde] : null, null);
    } else if (r.libros.length === 1 && !r.palabras.length) {
      const caja = document.createElement('div');
      res.appendChild(caja);
      montarCapitulos(caja, r.libros[0], null, (c) => { q.value = `${libros[r.libros[0] - 1].nombre} ${c}`; buscar(); });
    } else {
      let h = '';
      if (r.libros.length > 1) h += '<div class="seccion">Libros</div>' + r.libros.map((id) => `<button class="libro" data-l="${id}"><span>${esc(libros[id - 1].nombre)}</span><small>${libros[id - 1].capitulos}</small></button>`).join('');
      if (r.palabras.length) h += '<div class="seccion">Versículos</div>' + r.palabras.map((p) => `<button class="res-pal" data-l="${p.libro}" data-c="${p.capitulo}" data-v="${p.versiculo}"><div class="r"><span>${esc(libros[p.libro - 1].nombre)} ${p.capitulo}:${p.versiculo}</span><em data-cap="1">Capítulo</em></div><div class="t">${esc(p.texto)}</div></button>`).join('');
      if (r.canciones.length) h += '<div class="seccion">Canciones</div><div class="lista">' + r.canciones.map((c) => `<button class="fila" data-s="${c.id}"><span class="ic">${ico('cancion', 20)}</span><span class="tx"><b>${esc(c.titulo)}</b><small>${esc(c.autor || '')}</small></span></button>`).join('') + '</div>';
      res.innerHTML = h || '<div class="vacio">No encontré nada.</div>';
      res.querySelectorAll('.libro').forEach((b) => b.onclick = () => { q.value = libros[Number(b.dataset.l) - 1].nombre; buscar(); });
      res.querySelectorAll('.res-pal').forEach((b) => b.onclick = (ev) => {
        const l = Number(b.dataset.l); const c = Number(b.dataset.c); const ver = Number(b.dataset.v);
        if (ev.target.dataset.cap) { q.value = `${libros[l - 1].nombre} ${c}:${ver}`; buscar(); return; }
        enviar({ tipo: 'versiculo', libro: l, capitulo: c, versiculo: ver });
      });
      res.querySelectorAll('.fila').forEach((b) => b.onclick = () => enviar({ tipo: 'cancion', id: Number(b.dataset.s) }));
    }
  };
  q.oninput = () => { clearTimeout(tiempo); tiempo = setTimeout(buscar, 240); };
  q.onkeydown = (e) => { if (e.key === 'Enter') q.blur(); };
  x.onclick = () => { q.value = ''; buscar(); q.focus(); };
  buscar();
}

async function iniciar() {
  libros = await pedir('/libros');
  montarControles();
  montarBiblia();
  montarBuscar();
  irTab('buscar');
  const fuente = new EventSource('/eventos?k=' + k);
  fuente.onmessage = (m) => pintarEstado(JSON.parse(m.data));
  fuente.onerror = () => { $('estadoTxt').textContent = 'Sin conexión'; $('estado').className = 'estado off'; };
}
iniciar();
</script>

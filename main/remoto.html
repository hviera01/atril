<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15110e">
<title>Atril remoto</title>
<style>
:root{--tinta:#15110e;--panel:#1e1915;--panel2:#292219;--linea:#3a3025;--papel:#f1e8d8;--apagado:#9b8f7c;--brasa:#e8572a;--oro:#d8a24a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--tinta);color:var(--papel);font:16px/1.35 "Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;max-width:560px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--linea)}
header b{font:700 20px Georgia,serif;letter-spacing:.02em}
.estado{margin-left:auto;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--apagado)}
.estado.vivo{color:var(--brasa)}
.estado.off{color:#c0463a}
.vivo-card{margin:12px 16px 0;padding:14px 16px;background:var(--panel);border:1px solid var(--linea);border-left:4px solid var(--brasa);border-radius:4px;min-height:96px}
.vivo-card small{display:block;color:var(--oro);font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
.vivo-card p{margin:0;font:18px/1.35 Georgia,serif;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mandos{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0}
.mandos button{border:0;border-radius:4px;padding:20px 8px;font:700 18px "Segoe UI",sans-serif;background:var(--panel2);color:var(--papel);border:1px solid var(--linea)}
.mandos button.grande{background:var(--brasa);border-color:var(--brasa);color:#fff}
.mandos button:active{transform:scale(.98);filter:brightness(1.15)}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 16px 0}
.mini button{border:1px solid var(--linea);background:transparent;color:var(--papel);padding:11px 4px;border-radius:4px;font:600 14px "Segoe UI",sans-serif}
.mini.dos{grid-template-columns:1fr 1fr}
.mini button.on{background:var(--oro);color:#1b1408;border-color:var(--oro)}
nav{display:flex;margin:14px 16px 0;border-bottom:1px solid var(--linea)}
nav button{flex:1;background:none;border:0;color:var(--apagado);padding:10px;font:600 15px "Segoe UI",sans-serif;border-bottom:3px solid transparent}
nav button.on{color:var(--papel);border-bottom-color:var(--oro)}
main{flex:1;overflow:auto;padding:12px 16px 24px}
input{width:100%;padding:14px;background:var(--panel);border:1px solid var(--linea);color:var(--papel);border-radius:4px;font-size:17px;outline:none}
input:focus{border-color:var(--oro)}
.lista{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.fila{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--linea);border-radius:4px;padding:11px 12px;color:var(--papel);font:15px/1.35 "Segoe UI",sans-serif}
.fila b{color:var(--oro);margin-right:6px}
.fila.activa{border-color:var(--brasa);background:#2b1c16}
.fila small{display:block;color:var(--apagado);font-size:12px;margin-top:2px}
.vacio{color:var(--apagado);text-align:center;padding:30px 0}
h4{margin:16px 0 6px;font:600 12px "Segoe UI";letter-spacing:.1em;text-transform:uppercase;color:var(--apagado)}
</style>
</head>
<body>
<header><b>Atril</b><span class="estado" id="estado">conectando…</span></header>
<div class="vivo-card"><small id="vref">En pantalla</small><p id="vtexto">—</p></div>
<div class="mandos">
  <button id="ant">◀ Anterior</button>
  <button id="sig" class="grande">Siguiente ▶</button>
</div>
<div class="mini">
  <button id="negro">Negro</button>
  <button id="logo">Logo</button>
  <button id="limpiar">Limpiar</button>
</div>
<div class="mini dos">
  <button id="va">↑ Versículo ant.</button>
  <button id="vs">↓ Versículo sig.</button>
  <button id="ea">◀ Elemento ant.</button>
  <button id="es">Elemento sig. ▶</button>
</div>
<nav><button id="tb" class="on">Buscar</button><button id="tc">Culto</button></nav>
<main>
  <section id="pb"><input id="q" placeholder="Juan 3:16 · salmo 23 · amor de Dios" autocomplete="off" autocapitalize="off"><div class="lista" id="res"></div></section>
  <section id="pc" hidden><div class="lista" id="culto"></div></section>
</main>
<script>
const k = new URLSearchParams(location.search).get('k');
const $ = (id) => document.getElementById(id);
const enviar = (o) => fetch('/cmd?k=' + k, { method: 'POST', body: JSON.stringify(o) });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
$('sig').onclick = () => enviar({ tipo: 'siguiente' });
$('ant').onclick = () => enviar({ tipo: 'anterior' });
$('negro').onclick = () => enviar({ tipo: 'negro' });
$('logo').onclick = () => enviar({ tipo: 'logo' });
$('limpiar').onclick = () => enviar({ tipo: 'limpiar' });
$('va').onclick = () => enviar({ tipo: 'versoAnt' });
$('vs').onclick = () => enviar({ tipo: 'versoSig' });
$('ea').onclick = () => enviar({ tipo: 'elementoAnt' });
$('es').onclick = () => enviar({ tipo: 'elementoSig' });
$('tb').onclick = () => pestana('b');
$('tc').onclick = () => pestana('c');
function pestana(p) {
  $('pb').hidden = p !== 'b'; $('pc').hidden = p !== 'c';
  $('tb').classList.toggle('on', p === 'b'); $('tc').classList.toggle('on', p === 'c');
}
function pintar(e) {
  const st = $('estado');
  st.textContent = e.modo === 'negro' ? 'pantalla en negro' : e.modo === 'logo' ? 'logo' : e.vivo ? 'en vivo' : 'sin proyectar';
  st.className = 'estado' + (e.modo === 'contenido' && e.vivo ? ' vivo' : '');
  $('negro').classList.toggle('on', e.modo === 'negro');
  $('logo').classList.toggle('on', e.modo === 'logo');
  $('vref').textContent = e.vivo ? (e.vivo.ref || e.vivo.titulo || 'En pantalla') : 'En pantalla';
  $('vtexto').textContent = e.vivo ? e.vivo.texto : '—';
  $('culto').innerHTML = (e.elementos || []).length ? e.elementos.map((x) =>
    '<button class="fila' + (e.vivo && e.vivo.elementoId === x.id ? ' activa' : '') + '" data-id="' + esc(x.id) + '"' + (x.tipo === 'seccion' ? ' disabled style="opacity:.6"' : '') + '><b>' + esc(x.titulo) + '</b><small>' + esc(x.sub || '') + '</small></button>').join('')
    : '<div class="vacio">El culto está vacío</div>';
  document.querySelectorAll('#culto .fila').forEach((b) => b.onclick = () => enviar({ tipo: 'elemento', id: b.dataset.id }));
}
const fuente = new EventSource('/eventos?k=' + k);
fuente.onmessage = (m) => { $('estado').dataset.ok = 1; pintar(JSON.parse(m.data)); };
fuente.onerror = () => { $('estado').textContent = 'sin conexión'; $('estado').className = 'estado off'; };
let tiempo = 0;
$('q').oninput = () => { clearTimeout(tiempo); tiempo = setTimeout(buscar, 220); };
async function buscar() {
  const q = $('q').value.trim();
  if (!q) { $('res').innerHTML = ''; return; }
  const r = await (await fetch('/buscar?k=' + k + '&q=' + encodeURIComponent(q))).json();
  let h = '';
  if (r.referencia) {
    const rf = r.referencia;
    h += r.versiculos.map((v) => '<button class="fila" data-l="' + rf.libro + '" data-c="' + rf.capitulo + '" data-v="' + v.v + '"><b>' + v.v + '</b>' + esc(v.t) + '</button>').join('');
  }
  if (r.palabras.length) {
    h += '<h4>Versículos</h4>' + r.palabras.map((v) => '<button class="fila" data-l="' + v.libro + '" data-c="' + v.capitulo + '" data-v="' + v.versiculo + '"><b>' + v.capitulo + ':' + v.versiculo + '</b>' + esc(v.texto) + '</button>').join('');
  }
  if (r.canciones.length) {
    h += '<h4>Canciones</h4>' + r.canciones.map((c) => '<button class="fila" data-s="' + c.id + '"><b>' + esc(c.titulo) + '</b><small>' + esc(c.autor || '') + '</small></button>').join('');
  }
  $('res').innerHTML = h || '<div class="vacio">Nada encontrado</div>';
  document.querySelectorAll('#res .fila').forEach((b) => b.onclick = () => {
    if (b.dataset.s) enviar({ tipo: 'cancion', id: Number(b.dataset.s) });
    else enviar({ tipo: 'versiculo', libro: Number(b.dataset.l), capitulo: Number(b.dataset.c), versiculo: Number(b.dataset.v) });
  });
}
</script>
</body>
</html>
